[project]
name = "telecom-care-rag"
version = "0.1.0"
description = "RAG-powered telecom customer care assistant with LangChain, LangSmith, and guardrails"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-groq>=0.2",
    "langsmith>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
telecom-ingest = "telecom_rag.ingestion.run_all:ingest"
telecom-chat   = "cli:main"
telecom-eval   = "telecom_rag.evaluation.run_eval:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_rag", "cli.py"]

[tool.ruff]
line-length = 100
